[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kanforge"
version = "0.7.0.dev0"
description = "Kolmogorov–Arnold Networks for every backend: NumPy reference, PyTorch (CUDA/MPS/CPU), Apple MLX and JAX."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "fx-xf" }]
dependencies = ["numpy>=1.26"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
mlx = ["mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]
symbolic = ["sympy>=1.12"]
plot = ["matplotlib>=3.7"]
hf = ["transformers>=4.40"]
jax = ["jax>=0.4.30", "flax>=0.12"]
export = ["onnx>=1.15", "onnxruntime>=1.17"]
coreml = ["coremltools>=8.0"]
test = ["pytest>=8", "scipy>=1.11", "sympy>=1.12", "matplotlib>=3.7", "transformers>=4.40"]

[tool.hatch.build.targets.wheel]
packages = ["kanforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
