[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kanforge"
version = "0.0.1"
description = "Kolmogorov–Arnold Networks for every backend: NumPy reference, PyTorch (CUDA/MPS/CPU) and Apple MLX."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "fx-xf" }]
dependencies = ["numpy>=1.26"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
mlx = ["mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]
test = ["pytest>=8", "scipy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["kanforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
