name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extras: torch,jax,export,test
          - os: macos-14
            extras: torch,mlx,jax,export,coreml,test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch on Linux
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: python -m pytest -q

  # The Triton kernels run on CPU tensors under Triton's interpreter: this checks
  # their math without a GPU (speed is measured on a CUDA machine separately).
  triton-interpreter:
    runs-on: ubuntu-latest
    env:
      TRITON_INTERPRET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install triton -e ".[test]"
      - run: python -m pytest -q tests/test_kernels.py

  # Generated Verilog against the bit-exact model: Icarus Verilog simulation.
  fpga-rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[test]"
      - run: python -m pytest -q tests/test_export.py -k fpga -rs

  # Documentation must build without warnings (broken links, missing snippets, bad API refs).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  # The package builds, passes twine's checks and installs from the wheel.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: |
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel/bin/python -I -c "import kanforge, numpy as np; print(kanforge.__version__, kanforge.BSpline(5, 3)(np.zeros((2, 1))).shape)"
